# XcodeGen spec for PkMac on iPhone, iPhone Duo and iPad (iOS/build.sh generates PkMac.xcodeproj).
name: PkMac
options:
  bundleIdPrefix: app.pkmac
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  PkMac:
    type: application
    platform: iOS
    sources:
      - path: PkMacIOS
      - path: ../App/Sources/PkMac
        excludes:
          - "PkMacApp.swift"
          - "Engine/EngineClient.swift"
      - path: ../App/Resources/Lang
        type: folder
        buildPhase: resources
      - path: ../App/Resources/Icons
        type: folder
        buildPhase: resources
      - path: ../App/Resources/Logo.png
        buildPhase: resources
      - path: ../App/Resources/Sphere.png
        buildPhase: resources
      - path: ../App/Resources/pokeapi-forms.json
        buildPhase: resources
      - path: ../App/Resources/pokeapi-cosmetic.json
        buildPhase: resources
    info:
      path: PkMacIOS/Info.plist
      properties:
        CFBundleDisplayName: PkMac
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortraitUpsideDown]
        UISupportsDocumentBrowser: false
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        CFBundleLocalizations: [it, en]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Salvataggio Pokémon
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.data, public.zip-archive]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pkmac.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Alternate icons (made by iOS/make_icons.swift; ids must match AppIconManager.all and ICON_IDS in build.sh)
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-neon AppIcon-classica AppIcon-officina AppIcon-pixel AppIcon-floppy AppIcon-apertura AppIcon-finder AppIcon-matita AppIcon-scritta"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    postBuildScripts:
      - name: Embed PkMacEngine.framework
        basedOnDependencyAnalysis: false
        script: |
          set -e
          SRC="$SRCROOT/../build/ios/$PLATFORM_NAME/PkMacEngine.framework"
          if [ ! -d "$SRC" ]; then echo "warning: $SRC mancante (esegui iOS/build_engine.sh)"; exit 0; fi
          DST="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          mkdir -p "$DST"
          rsync -a --delete "$SRC" "$DST/"
