name: Build & release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26*.app || true
      - name: Build
        env:
          PKMAC_REPO: ${{ github.repository }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PkMac
          path: |
            build/PkMac.zip
            build/PkMacEngine-osx-arm64.zip
      - name: Version
        id: ver
        run: |
          V=$(python3 -c "import json;print(json.load(open('versions.json'))['app'])")
          echo "app=$V" >> $GITHUB_OUTPUT
          if gh release view "v$V" -R "${{ github.repository }}" >/dev/null 2>&1; then echo "exists=true" >> $GITHUB_OUTPUT; else echo "exists=false" >> $GITHUB_OUTPUT; fi
        env:
          GH_TOKEN: ${{ github.token }}
      # A new app version in versions.json (or a pushed v* tag) publishes a release.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.app) }}
          name: PkMac ${{ steps.ver.outputs.app }}
          target_commitish: ${{ github.sha }}
          files: |
            build/PkMac.zip
            build/PkMacEngine-osx-arm64.zip
          # Notes written by hand in release-notes/<version>.md; GitHub's commit list only as a fallback.
          body_path: ${{ hashFiles(format('release-notes/{0}.md', steps.ver.outputs.app)) != '' && format('release-notes/{0}.md', steps.ver.outputs.app) || '' }}
          generate_release_notes: ${{ hashFiles(format('release-notes/{0}.md', steps.ver.outputs.app)) == '' }}

  # Keeps the text of an already published release in sync with release-notes/<version>.md.
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python3 -c "import json;print(json.load(open('versions.json'))['app'])")
          F="release-notes/$V.md"
          if [ -f "$F" ] && gh release view "v$V" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "v$V" -R "${{ github.repository }}" --notes-file "$F"
            echo "Note della release v$V aggiornate"
          else
            echo "Nessuna release v$V esistente o nessun file $F"
          fi
