name: Build & release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26*.app || true
      - name: Build
        env:
          PKMAC_REPO: ${{ github.repository }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PkMac
          path: |
            build/PkMac.zip
            build/PkMacEngine-osx-arm64.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/PkMac.zip
            build/PkMacEngine-osx-arm64.zip
          generate_release_notes: true
